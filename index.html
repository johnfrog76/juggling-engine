<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juggling Engine — read siteswap without learning to read siteswap</title>
    <meta
      name="description"
      content="Siteswap describes juggling patterns as numbers. Most jugglers cannot read it. This reads it for you: type a pattern and watch it run, every arc solved from the notation."
    />
    <meta property="og:title" content="Juggling Engine" />
    <meta
      property="og:description"
      content="Type a siteswap and watch it run. Every arc solved from the notation, not looked up."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M 11 46 C 17 16 47 16 53 46' fill='none' stroke='%2362e6ff' stroke-width='3' stroke-linecap='round' opacity='0.5'/%3E%3Ccircle cx='32' cy='13' r='9' fill='%23ffb347'/%3E%3Ccircle cx='11' cy='48' r='9' fill='%23ff5f8f'/%3E%3Ccircle cx='53' cy='48' r='9' fill='%2362e6ff'/%3E%3C/svg%3E" />
    <style>
      /* Painted before React mounts so there is never a white flash — the whole
         thing is a dark stage and a flash of white reads as a broken page. */
      html,
      body {
        margin: 0;
        background: #131022;
        color: #eae6f6;
        /* Tells the browser to render its OWN chrome dark -- scrollbars, form
           controls, the overscroll gutter. FluentProvider themes the components
           it renders and cannot reach any of that, so without this line a dark
           page gets a light scrollbar down the side of it. */
        color-scheme: dark;
      }

      /* PORTALS TOO. Fluent renders its overlay drawer into a portal outside
         #root, so a rule scoped to html/body never reaches the panel's own
         scroll container -- which is exactly where a light scrollbar showed up
         on a dark drawer. Applying the scheme to everything covers it. */
      * {
        color-scheme: dark;
      }

      /* WebKit still wants explicit colours: `color-scheme` alone leaves Chrome
         with its default scrollbar on some platforms. Tuned to the panel and
         border tokens so the bar reads as part of the page. */
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #131022;
      }
      ::-webkit-scrollbar-thumb {
        background: #282344;
        border-radius: 6px;
        border: 3px solid #131022;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a3358;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
